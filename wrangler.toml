# Nama harus SAMA dengan nama Worker di dashboard Cloudflare (tampil di bagian atas halaman proyek).
name = "briefzy"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# Penyimpanan artikel/kategori/tim. Tanpa "id", Wrangler membuat KV namespace otomatis saat deploy.
[[kv_namespaces]]
binding = "BRIEFZY_KV"
